name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      root_released: ${{ steps.release.outputs.release_created }}
      extension_released: ${{ steps.release.outputs['apps/chrome-extension--release_created'] }}
      extension_tag: ${{ steps.release.outputs['apps/chrome-extension--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A pull request opened with GITHUB_TOKEN starts no workflows. Set
          # RELEASE_PLEASE_TOKEN (a PAT with contents and pull-requests write)
          # to get CI on release pull requests.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A dispatch skips release-please, so `!cancelled()` lets this job run after a
  # skipped dependency.
  publish:
    needs: release-please
    if: >-
      ${{ !cancelled() && (needs.release-please.outputs.root_released == 'true'
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/release.ts --skip-gates

  # Attaches the store zip to the extension's GitHub release, so the release
  # page is where users download it from. This runs as a job here rather than
  # on a `release: published` trigger because releases created with
  # GITHUB_TOKEN do not fire other workflows.
  extension-zip:
    needs: release-please
    if: needs.release-please.outputs.extension_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.extension_tag }}
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm extension:package
      - run: gh release upload "$TAG" apps/chrome-extension/release/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.extension_tag }}
