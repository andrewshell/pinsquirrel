    <line x1="64" y1="10" x2="64" y2="22"/>
    <path fill="#bc8042" d="M28 60 C25 84 44 106 64 118 C84 106 103 84 100 60 Z"/>
    <path fill="#bc8042" d="M24 60 C24 36 42 20 64 20 C86 20 104 36 104 60 Z"/>
  </g>
</svg>
