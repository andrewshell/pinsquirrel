packages:
  - apps/*
  - libs/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  axios: '>=1.18.0'
  undici: '>=8.9.0'
  form-data: '>=4.0.6'
  fast-uri: '>=4.1.2'
  qs: '>=6.15.2'
  ip-address: '>=10.3.1'
  '@hono/node-server': '>=2.0.5'
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  body-parser: '>=2.3.0'
  brace-expansion: '>=5.0.9'
  postcss: '>=8.5.23'
  happy-dom: '>=20.8.9'
  tsup>esbuild: ^0.28.1
  bundle-require>esbuild: ^0.28.1

peerDependencyRules:
  allowedVersions:
    '@hono/mcp>hono-rate-limiter': 0.4.2
